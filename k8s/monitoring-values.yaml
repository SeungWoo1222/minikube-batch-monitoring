#function kubectl { minikube kubectl -- @args }# Alertmanager: 알림 실습 전까지 끄기 (메모리 절약)
alertmanager:
  enabled: false

# Minikube에서는 수집이 잘 안 되는 구성 요소 → 끄기 (불필요한 오류 방지)
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 1d                 # 데이터 1일만 보관
    resources:
      requests:
        cpu: 100m
        memory: 300Mi
      limits:
        memory: 800Mi
    # 차트 밖에서 만든 ServiceMonitor도 수집하도록 (7단계 Jenkins 연결에 필요)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  adminPassword: "lab-admin-1234"   # 실습 전용 비밀번호 (실제 비밀번호 재사용 금지)
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 300Mi

prometheus-node-exporter:
  extraArgs:
    - --collector.textfile.directory=/host/textfile
  extraHostVolumeMounts:
    - name: textfile
      hostPath: /data/textfile
      mountPath: /host/textfile
      readOnly: true